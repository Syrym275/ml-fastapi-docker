# Runs the serving part of the system with one command:
#     docker compose up --build
#
#   api       FastAPI + model.joblib   -> http://localhost:8000/docs
#   frontend  Streamlit page           -> http://localhost:8501
#
# Training and MLflow tracking run on the developer machine (python train.py,
# mlflow ui). train.py writes model.joblib + model_info.json, which are copied
# into the api image when it is built.
name: heart-disease-ml

services:
  api:
    build: .
    ports:
      - "8000:8000"
    # Docker checks that the API answers before starting the frontend.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    environment:
      # Inside the Compose network the API is reachable by its service name.
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
